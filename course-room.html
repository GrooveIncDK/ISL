<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Room — ISL, The Institute of Spiritual Learning</title>
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night: #171B21; --night-2: #212730;
  --gold: #F0B106; --turquoise: #2BACCC; --turquoise-text: #6cc9e0; --skyblue: #54ACD9; --lavender: #BE81F7;
  --charcoal: #343434;
  --line-dark: rgba(255,255,255,0.14); --ink-on-dark: rgba(255,255,255,0.92); --soft-on-dark: rgba(255,255,255,0.62);
  --clr-error: #ff8a75;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink-on-dark);font-family:"Jost",Arial,sans-serif;font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;margin:0;color:#fff;}
a{color:var(--turquoise-text);text-decoration:none;}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
.eyebrow{font-family:"Jost",Arial,sans-serif;font-size:0.72rem;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--skyblue);margin:0 0 14px;display:block;}

header.app-nav{border-bottom:1px solid var(--line-dark);background:var(--night);position:sticky;top:0;z-index:40;}
.nav-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;flex-wrap:wrap;gap:12px;}
.wordmark{display:flex;align-items:center;gap:12px;color:#fff;}
.wordmark .isl-icon{height:30px;width:auto;}
.wordmark .isl-icon-ring{color:var(--turquoise);}
.wordmark .isl-icon-dot{fill:var(--night);}
.wordmark .tagline{font-family:"Jost",Arial,sans-serif;font-size:0.62rem;font-weight:500;line-height:1.3;letter-spacing:0.03em;text-transform:uppercase;color:var(--soft-on-dark);}
nav.app-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
nav.app-links a{font-family:"Jost",Arial,sans-serif;font-size:0.92rem;font-weight:300;color:var(--soft-on-dark);padding:10px 15px;}
nav.app-links a.active{color:var(--gold);font-weight:500;}
nav.app-links a:hover{color:#fff;}
#signOutBtn{background:none;border:1px solid var(--line-dark);color:var(--ink-on-dark);border-radius:999px;padding:9px 18px;cursor:pointer;font-size:.82rem;font-family:"Jost",Arial,sans-serif;}
#signOutBtn:hover{border-color:var(--turquoise);color:var(--turquoise-text);}

.breadcrumb{padding:22px 0 0;font-size:0.86rem;color:var(--soft-on-dark);display:flex;align-items:center;gap:8px;}
.breadcrumb svg{width:12px;height:12px;}

.room-hero{padding:18px 0 32px;}
.room-hero h1{font-style:italic;font-size:clamp(1.8rem,3.4vw,2.1rem);margin-bottom:6px;}
.room-hero .sub{color:var(--soft-on-dark);font-size:0.98rem;}

.mech-track{display:flex;align-items:center;gap:0;padding:8px 0 44px;flex-wrap:wrap;}
.mech-step{display:flex;align-items:center;gap:10px;font-size:0.84rem;font-weight:500;color:var(--soft-on-dark);}
.mech-step .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line-dark);flex-shrink:0;}
.mech-step.done{color:#fff;} .mech-step.done .dot{background:var(--turquoise);border-color:var(--turquoise);color:var(--charcoal);}
.mech-step.current{color:#fff;} .mech-step.current .dot{background:var(--turquoise);border-color:var(--turquoise);color:var(--charcoal);}
.mech-sep{width:44px;height:1px;background:var(--line-dark);margin:0 12px;}

section.room-section{padding:32px 0;border-top:1px solid var(--line-dark);}
section.room-section h2{font-style:italic;font-size:1.38rem;margin-bottom:20px;}
.section-note{color:var(--soft-on-dark);font-size:0.95rem;margin:-8px 0 16px;}

.reading-check{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
.reading-check li{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;background:var(--night-2);border-radius:8px;font-size:0.96rem;cursor:pointer;border:none;width:100%;text-align:left;color:var(--ink-on-dark);font-family:"Jost",Arial,sans-serif;}
.reading-check .tick{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;border:1.5px solid var(--line-dark);}
.reading-check li.read .tick{background:var(--turquoise);border-color:var(--turquoise);color:var(--charcoal);}
.reading-check li.read span.title{color:var(--soft-on-dark);text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.3);}
.reading-check li:disabled, .reading-check li.saving{opacity:0.6;cursor:wait;}
.reading-check .rtext{display:flex;flex-direction:column;gap:4px;}
.reading-check .rnote{font-size:0.84rem;color:var(--soft-on-dark);font-weight:300;}

.week-block{padding:30px 0;border-top:1px solid var(--line-dark);}
.week-block:first-of-type{border-top:none;padding-top:6px;}
.week-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.week-num{font-family:"Jost",Arial,sans-serif;font-size:0.72rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--skyblue);flex-shrink:0;}
.week-head h3{font-style:italic;font-size:1.28rem;}
.teaching-body{color:var(--ink-on-dark);font-size:0.98rem;margin:0 0 22px;display:grid;gap:14px;max-width:74ch;}
.teaching-body p{margin:0;}
.week-reading{margin-bottom:22px;}
.week-reading-label{display:block;font-family:"Jost",Arial,sans-serif;font-size:0.76rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--soft-on-dark);margin-bottom:10px;}

.closing-intro{color:var(--soft-on-dark);font-size:0.96rem;max-width:70ch;margin:-8px 0 22px;}

.tutor-feedback{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line-dark);}
.tutor-feedback h5{font-family:"Jost",Arial,sans-serif;font-weight:500;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--skyblue);margin:0 0 10px;}
.tutor-feedback-text{white-space:pre-wrap;line-height:1.7;font-size:0.94rem;color:var(--ink-on-dark);}
.isl-annot{background:rgba(240,177,6,0.26);border-bottom:1.5px solid var(--gold);border-radius:2px;}
.isl-annot::after{content:attr(data-idx);font-size:0.62em;vertical-align:super;margin-left:2px;color:var(--gold);font-weight:700;}
.isl-comment-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;}
.isl-comment-list li{display:flex;gap:12px;background:var(--night);border:1px solid var(--line-dark);border-radius:8px;padding:12px 14px;align-items:flex-start;}
.isl-comment-num{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--charcoal);font-size:0.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.isl-comment-quote{font-style:italic;color:var(--soft-on-dark);font-size:0.82rem;}
.isl-comment-text{margin:4px 0 0;font-size:0.9rem;}
.isl-comment-orphaned{margin-top:12px;font-size:0.82rem;color:var(--soft-on-dark);}
.isl-comment-orphaned ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;}

.workbook-card{background:linear-gradient(135deg, var(--night-2), #182430);border:1.5px solid var(--gold);border-radius:16px;padding:28px 30px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:14px;}
.workbook-card .icon{width:52px;height:52px;border-radius:12px;background:rgba(240,177,6,0.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.workbook-card .icon svg{width:24px;height:24px;color:var(--gold);}
.workbook-card .info{flex-grow:1;}
.workbook-card h3{font-style:italic;font-size:1.1rem;margin-bottom:4px;}
.workbook-card .meta{font-size:0.84rem;color:var(--soft-on-dark);}
.btn-dl{flex-shrink:0;display:flex;align-items:center;gap:8px;font-weight:500;font-size:0.88rem;padding:13px 22px;border-radius:6px;background:var(--gold);color:var(--charcoal) !important;}
.btn-dl svg{width:15px;height:15px;}
.workbook-note{margin-top:10px;font-size:0.84rem;color:var(--soft-on-dark);}

.exercise-block{margin-bottom:28px;}
.exercise-block h4{font-family:"Jost",Arial,sans-serif;font-weight:500;font-size:1rem;color:#fff;margin:0 0 6px;}
.exercise-block .ex-body{color:var(--soft-on-dark);font-size:0.92rem;margin:0 0 14px;}
textarea.reflection{width:100%;min-height:140px;background:var(--night-2);border:1px solid var(--line-dark);border-radius:8px;color:#fff;padding:16px;font-family:"Jost",Arial,sans-serif;font-size:0.96rem;resize:vertical;}
.save-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px;}
.save-status{font-size:0.82rem;color:var(--soft-on-dark);}
.btn-save{font-weight:500;font-size:0.88rem;padding:12px 22px;border-radius:6px;background:var(--gold);color:var(--charcoal);border:none;cursor:pointer;font-family:"Jost",Arial,sans-serif;}
.btn-save:disabled{opacity:0.6;cursor:wait;}

.tutorial-card{display:flex;align-items:center;justify-content:space-between;background:var(--night-2);border:1px solid var(--line-dark);border-radius:14px;padding:28px 30px;margin-top:12px;gap:20px;flex-wrap:wrap;}
.tutorial-card.unlocked{border-color:var(--gold);}
.tutorial-card h3{font-style:italic;font-size:1.18rem;margin-bottom:4px;}
.tutorial-card p{margin:0;color:var(--soft-on-dark);font-size:0.9rem;max-width:44ch;}
.btn-book{flex-shrink:0;font-weight:500;font-size:0.88rem;padding:13px 24px;border-radius:6px;}
.btn-book.locked{background:rgba(255,255,255,0.08);color:var(--soft-on-dark);pointer-events:none;}
.btn-book.unlocked{background:var(--gold);color:var(--charcoal) !important;}

.empty-note{color:var(--soft-on-dark);font-size:0.92rem;padding:14px 18px;background:var(--night-2);border-radius:8px;}
.room-error{max-width:640px;margin:70px auto;text-align:center;padding:0 24px;}
.room-error h1{font-style:italic;margin-bottom:14px;}
.room-error p{color:var(--soft-on-dark);margin-bottom:24px;}
.loading{text-align:center;padding:80px 0;color:var(--soft-on-dark);}
</style>
</head>
<body>
<header class="app-nav">
  <div class="wrap nav-row">
    <a class="wordmark" href="index.html">
      <span data-isl-logo data-height="30px"></span>
      <span class="tagline">The Institute of Spiritual Learning</span>
    </a>
    <nav class="app-links" id="appLinks">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a class="active" href="account.html">My Courses</a>
      <button id="signOutBtn" type="button">Sign Out</button>
    </nav>
  </div>
</header>

<div id="roomRoot" class="loading">Loading your course room&hellip;</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/annotations.js"></script>
<script src="assets/js/site-nav.js"></script>
<script>
(async () => {
  const root = document.getElementById('roomRoot');
  const params = new URLSearchParams(window.location.search);
  const courseId = params.get('course');

  if (typeof sb === 'undefined' || !sb) {
    root.className = '';
    root.innerHTML = '<div class="room-error"><h1>Unavailable</h1><p>We couldn&rsquo;t connect to our account system. Please check your connection and refresh the page.</p></div>';
    return;
  }
  const user = await requireAuth('signin.html');
  if (!user) return;

  if (await isAdmin()) {
    const appLinks = document.getElementById('appLinks');
    const markLink = document.createElement('a');
    markLink.href = 'mark-work.html';
    markLink.textContent = 'Mark Work';
    appLinks.insertBefore(markLink, document.getElementById('signOutBtn'));
  }

  if (!courseId) {
    root.className = '';
    root.innerHTML = '<div class="room-error"><h1>No course selected</h1><p>This page needs a course to open — head back to My Courses and choose one from there.</p><a class="btn-dl" href="account.html">Go to My Courses</a></div>';
    return;
  }

  const [{ data: course }, purchased] = await Promise.all([
    sb.from('courses').select('id, title, duration').eq('id', courseId).single(),
    hasPurchased(courseId),
  ]);

  if (!course) {
    root.className = '';
    root.innerHTML = '<div class="room-error"><h1>Course not found</h1><p>We couldn&rsquo;t find that course.</p><a class="btn-dl" href="account.html">Go to My Courses</a></div>';
    return;
  }
  if (!purchased) {
    root.className = '';
    root.innerHTML = '<div class="room-error"><h1>Not yet enrolled</h1><p>You haven&rsquo;t enrolled in ' + course.title + ' yet.</p><a class="btn-dl" href="courses/' + course.id + '.html">View course</a></div>';
    return;
  }

  const [content, progressRows, eligibleCourseIds] = await Promise.all([
    getGatedContent(courseId),
    sb.from('progress').select('content_id, attempted_at, reflection_text').then(r => r.data || []),
    getBookingEligibility(),
  ]);
  const progressByContent = Object.fromEntries(progressRows.map(r => [r.content_id, r]));

  const allReading = content.filter(c => (c.content_type || 'reading') === 'reading');
  const allExercises = content.filter(c => c.content_type === 'exercise');
  const eligible = eligibleCourseIds.includes(courseId);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="width:11px;height:11px;"><path d="M20 6L9 17l-5-5"/></svg>';

  let readingStep = allReading.length === 0 || allReading.every(r => progressByContent[r.id]) ? 'done' : 'current';
  let writeStep = allExercises.length > 0 && allExercises.every(e => progressByContent[e.id] && progressByContent[e.id].reflection_text) ? 'done' : (readingStep === 'done' ? 'current' : '');

  function readingListHtml(items, label) {
    let h = '';
    if (label) h += '<span class="week-reading-label">' + esc(label) + '</span>';
    h += '<ul class="reading-check">' + items.map(r => {
      const done = !!progressByContent[r.id];
      return '<li class="' + (done ? 'read' : '') + '" data-content-id="' + r.id + '"><span class="tick">' + (done ? TICK : '') + '</span> <span class="rtext"><span class="title">' + esc(r.title) + '</span>' + (r.body ? '<span class="rnote">' + esc(r.body) + '</span>' : '') + '</span></li>';
    }).join('') + '</ul>';
    return h;
  }

  function workbookCardHtml(w) {
    return '<div class="workbook-card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>' +
      '<div class="info"><h3>' + esc(w.title) + '</h3>' + (w.body ? '<div class="meta">' + esc(w.body) + '</div>' : '') + '</div>' +
      (w.download_url ? '<a class="btn-dl" href="' + esc(w.download_url) + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg> Download</a>' : '') +
      '</div>';
  }

  function exerciseBlockHtml(ex) {
    const p = progressByContent[ex.id];
    const savedText = p && p.reflection_text ? p.reflection_text : '';
    return '<div class="exercise-block" data-content-id="' + ex.id + '">' +
      '<h4>' + esc(ex.title) + '</h4>' +
      (ex.body ? '<p class="ex-body">' + esc(ex.body) + '</p>' : '') +
      '<textarea class="reflection" placeholder="Write your reflection here...">' + esc(savedText) + '</textarea>' +
      '<div class="save-row"><span class="save-status"></span><button class="btn-save" type="button">Save &amp; submit</button></div>' +
    '</div>';
  }

  function teachingHtml(t) {
    const heading = t.title.replace(/^Week\s*\d+\s*[—-]\s*/, '');
    return { heading, body: '<div class="teaching-body">' + t.body.split(/\n\s*\n/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') + '</div>' };
  }

  let html = '';
  html += '<div class="breadcrumb wrap"><a href="account.html">My Courses</a> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg> <span>' + esc(course.title) + '</span></div>';
  html += '<div class="wrap room-hero"><span class="eyebrow">Course Room</span><h1>' + esc(course.title) + '</h1><div class="sub">Your practice space &mdash; the readings, the teaching, and the exercise that leads to your tutorial.</div></div>';

  html += '<div class="wrap mech-track">' +
    '<div class="mech-step ' + (readingStep === 'done' ? 'done' : 'current') + '"><span class="dot">' + (readingStep === 'done' ? '&#10003;' : '1') + '</span> Read</div>' +
    '<span class="mech-sep"></span>' +
    '<div class="mech-step ' + (writeStep === 'done' ? 'done' : (writeStep === 'current' ? 'current' : '')) + '"><span class="dot">' + (writeStep === 'done' ? '&#10003;' : '2') + '</span> Write</div>' +
    '<span class="mech-sep"></span>' +
    '<div class="mech-step ' + (eligible ? 'done' : '') + '"><span class="dot">' + (eligible ? '&#10003;' : '3') + '</span> Tutorial</div>' +
  '</div>';

  // Group content by week. Courses that don't use the weekly mechanic
  // (no week_number set on any row) fall back to the original flat
  // by-type layout below.
  const byWeek = {};
  content.forEach(c => { const wk = c.week_number || 0; (byWeek[wk] = byWeek[wk] || []).push(c); });
  const weekNums = Object.keys(byWeek).map(Number).filter(n => n > 0).sort((a, b) => a - b);

  // A week with no 'teaching' and no 'reading' rows (just exercise —
  // e.g. the closing contemplation) is rendered as the closing
  // section rather than another numbered week.
  let closingWeek = null;
  if (weekNums.length) {
    const last = weekNums[weekNums.length - 1];
    const lastItems = byWeek[last];
    if (lastItems.every(c => c.content_type === 'exercise')) {
      closingWeek = last;
      weekNums.pop();
    }
  }

  if (weekNums.length === 0 && closingWeek === null) {
    // Legacy flat layout — no week structure on this course yet.
    const workbook = content.filter(c => c.content_type === 'workbook');

    html += '<section class="room-section wrap"><h2>Your reading</h2>';
    html += allReading.length === 0
      ? '<div class="empty-note">Reading materials for this course are being finalised &mdash; check back soon.</div>'
      : readingListHtml(allReading);
    html += '</section>';

    html += '<section class="room-section wrap"><h2>Your workbook</h2>';
    if (workbook.length === 0) {
      html += '<div class="empty-note">No downloadable workbook has been added for this course yet.</div>';
    } else {
      html += workbook.map(workbookCardHtml).join('');
      html += '<div class="workbook-note">Yours to keep &mdash; it stays downloaded on your device even after the course ends or your access here changes.</div>';
    }
    html += '</section>';

    html += '<section class="room-section wrap"><h2>Your exercise</h2>';
    html += allExercises.length === 0
      ? '<div class="empty-note">The exercise for this course is being finalised &mdash; check back soon.</div>'
      : allExercises.map(exerciseBlockHtml).join('');
    html += '</section>';
  } else {
    // Weekly layout.
    html += '<section class="room-section wrap"><h2>Your five weeks</h2>';
    html += weekNums.map(wk => {
      const items = byWeek[wk];
      const teaching = items.find(c => c.content_type === 'teaching');
      const reading = items.filter(c => c.content_type === 'reading');
      const workbookItems = items.filter(c => c.content_type === 'workbook');
      const exercises = items.filter(c => c.content_type === 'exercise');
      const t = teaching ? teachingHtml(teaching) : null;
      let h = '<div class="week-block" data-week="' + wk + '">';
      h += '<div class="week-head"><span class="week-num">Week ' + wk + '</span>' + (t ? '<h3>' + esc(t.heading) + '</h3>' : '') + '</div>';
      if (t) h += t.body;
      if (reading.length) h += '<div class="week-reading">' + readingListHtml(reading, "This week's reading") + '</div>';
      h += workbookItems.map(workbookCardHtml).join('');
      h += exercises.map(exerciseBlockHtml).join('');
      h += '</div>';
      return h;
    }).join('');
    html += '</section>';

    if (closingWeek !== null) {
      html += '<section class="room-section wrap"><h2>Your closing contemplation</h2>';
      html += '<p class="closing-intro">The last step before your tutorial &mdash; bring your five handbook paragraphs together into one closing piece.</p>';
      html += byWeek[closingWeek].map(exerciseBlockHtml).join('');
      html += '</section>';
    }
  }

  html += '<section class="room-section wrap" style="padding-bottom:64px;"><h2>Your tutorial</h2>';
  if (eligible) {
    html += '<div class="tutorial-card unlocked"><div><h3>Ready when you are</h3><p>Book a personal session with Benjamin to discuss your course.</p></div><a class="btn-book unlocked" href="tutorial-booking.html?course=' + esc(courseId) + '">Book tutorial</a></div>';
  } else {
    html += '<div class="tutorial-card"><div><h3>Locked for now</h3><p>Engage with at least one part of this course above to unlock booking a personal tutorial.</p></div><span class="btn-book locked">Book tutorial</span></div>';
  }
  html += '</section>';

  root.className = '';
  root.innerHTML = html;

  // Reading: click to toggle attempted
  root.querySelectorAll('.reading-check li').forEach(li => {
    li.addEventListener('click', async () => {
      if (li.classList.contains('read') || li.classList.contains('saving')) return;
      li.classList.add('saving');
      await markAttempted(li.dataset.contentId);
      li.classList.remove('saving');
      li.classList.add('read');
      li.querySelector('.tick').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="width:11px;height:11px;"><path d="M20 6L9 17l-5-5"/></svg>';
    });
  });

  // Exercises: save & submit
  root.querySelectorAll('.exercise-block').forEach(block => {
    const btn = block.querySelector('.btn-save');
    const status = block.querySelector('.save-status');
    const textarea = block.querySelector('.reflection');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Saving\u2026';
      const { error } = await saveReflection(block.dataset.contentId, textarea.value);
      btn.disabled = false;
      status.textContent = error ? 'Could not save — please try again.' : 'Saved just now.';
      if (!error) {
        // Refresh so the mechanic track / tutorial eligibility reflect the new state.
        setTimeout(() => location.reload(), 700);
      }
    });
  });

  // Tutor feedback: show any comments the tutor has left on a saved
  // exercise, right below that exercise. Only fetched for exercises
  // that already have saved text — nothing to comment on otherwise.
  for (const block of root.querySelectorAll('.exercise-block')) {
    const contentId = block.dataset.contentId;
    const p = progressByContent[contentId];
    if (!p || !p.reflection_text) continue;
    const comments = await getComments(contentId, user.id);
    if (!comments.length) continue;
    const resolved = islResolveComments(p.reflection_text, comments);
    const fb = document.createElement('div');
    fb.className = 'tutor-feedback';
    fb.innerHTML = '<h5>Tutor feedback</h5><div class="tutor-feedback-text">' + islRenderAnnotated(p.reflection_text, resolved) + '</div>' + islRenderCommentList(resolved, { deletable: false });
    block.appendChild(fb);
  }
})();

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'index.html';
});
</script>
</body>
</html>
