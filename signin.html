<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — ISL, The Institute of Spiritual Learning</title>
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --white: #ffffff; --charcoal: #343434; --charcoal-soft: #6b6b6b;
  --turquoise: #2BACCC; --turquoise-text: #208199; --turquoise-tint: #EAF6F9;
  --skyblue: #54ACD9; --lavender: #BE81F7; --gold: #F0B106;
  --line: #e7e7e7; --paper: #f5f6f7;
  --clr-success: #1f9d6b; --clr-error: #c0392b;
  --radius-md: 12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Jost",Arial,sans-serif;font-weight:300;background:var(--paper);color:var(--charcoal);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;color:var(--charcoal);}
.brand .isl-icon-ring{color:#3ED6ED;}
.brand .isl-icon-dot{fill:#092632;}
.brand .isl-letters{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:1.4rem;}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);padding:40px;max-width:400px;width:100%;box-shadow:0 24px 60px -32px rgba(20,20,20,0.28)}
h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-style:italic;font-size:1.7rem;margin:0 0 6px;color:var(--charcoal);}
.sub{color:var(--charcoal-soft);font-size:.92rem;margin:0 0 28px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px}
.tab{flex:1;text-align:center;padding:12px;font-weight:500;font-size:.92rem;color:var(--charcoal-soft);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--charcoal);border-bottom-color:var(--turquoise)}
.field{margin-bottom:16px}
label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px;color:var(--charcoal);}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;font-family:"Jost",Arial,sans-serif;font-size:.95rem;color:var(--charcoal);}
input:focus-visible{outline:none;border-color:var(--turquoise)}
.btn{width:100%;padding:14px;border:none;border-radius:6px;background:var(--turquoise);color:var(--charcoal);font-weight:500;font-size:.95rem;cursor:pointer;margin-top:8px;font-family:"Jost",Arial,sans-serif;}
.btn:hover{background:#239bb8}
.btn:disabled{opacity:.6;cursor:not-allowed}
.status{border-radius:6px;padding:12px 14px;font-size:.85rem;margin-top:16px;display:none}
.status.error{display:block;background:#fdf0ef;border:1px solid rgba(192,57,43,.3);color:var(--clr-error)}
.status.success{display:block;background:#eaf9f2;border:1px solid rgba(31,157,107,.3);color:var(--clr-success)}
.status.info{display:block;background:var(--turquoise-tint);border:1px solid rgba(43,172,204,.3);color:var(--turquoise-text)}
.back{display:block;text-align:center;margin-top:20px;font-size:.85rem;color:var(--charcoal-soft);text-decoration:none}
.back:hover{color:var(--turquoise-text)}
.pane{display:none}
.pane.active{display:block}
</style>
</head>
<body>
<a class="brand" href="index.html">
  <svg class="isl-icon" style="height:34px;width:auto;" viewBox="0 0 903 907" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <mask id="signinO"><rect width="903" height="907" fill="black"/><circle cx="459.4" cy="451.7" r="433.5" fill="white"/><circle cx="454.0" cy="491.4" r="312.8" fill="black"/><circle cx="122.3" cy="492.2" r="177.3" fill="black"/></mask>
      <mask id="signinI"><rect width="903" height="907" fill="black"/><circle cx="494.6" cy="475.7" r="215.8" fill="white"/><circle cx="498.3" cy="463.5" r="164.9" fill="black"/><circle cx="652.8" cy="482.8" r="110.6" fill="black"/></mask>
    </defs>
    <rect width="903" height="907" fill="currentColor" class="isl-icon-ring" mask="url(#signinO)"/>
    <rect width="903" height="907" fill="currentColor" class="isl-icon-ring" mask="url(#signinI)"/>
    <circle cx="122.3" cy="492.2" r="112.1" class="isl-icon-dot"/>
    <circle cx="652.8" cy="482.8" r="63.8" class="isl-icon-dot"/>
  </svg>
  <span class="isl-letters">ISL</span>
</a>
<div class="card">
  <h1 id="cardTitle">Welcome back</h1>
  <p class="sub" id="cardSub">Sign in to access your courses.</p>

  <div class="tabs">
    <div class="tab active" data-tab="signin">Sign In</div>
    <div class="tab" data-tab="signup">Create Account</div>
  </div>

  <div class="pane active" id="signinPane">
    <form id="signinForm">
      <div class="field">
        <label for="signinEmail">Email</label>
        <input type="email" id="signinEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label for="signinPassword">Password</label>
        <input type="password" id="signinPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="signinBtn">Sign In</button>
    </form>
  </div>

  <div class="pane" id="signupPane">
    <form id="signupForm">
      <div class="field">
        <label for="signupName">Full name</label>
        <input type="text" id="signupName" required autocomplete="name">
      </div>
      <div class="field">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="signupBtn">Create Account</button>
    </form>
  </div>

  <div class="status" id="statusBox"></div>
  <a class="back" href="index.html">&larr; Back to ISL</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
function setStatus(type, message) {
  const el = document.getElementById('statusBox');
  el.className = 'status ' + type;
  el.textContent = message;
}

function getReturnTo() {
  const params = new URLSearchParams(window.location.search);
  return params.get('returnTo') || 'account.html';
}

// Admins land on their Teacher Dashboard by default rather than the
// student-facing My Courses page, unless a specific returnTo was
// requested (e.g. a course page sent them here to sign in first).
async function getPostSignInDestination() {
  const params = new URLSearchParams(window.location.search);
  const explicit = params.get('returnTo');
  if (explicit) return explicit;
  try {
    if (await isAdmin()) return 'mark-work.html';
  } catch (e) { /* fall through to the student default */ }
  return 'account.html';
}

// ---- Tab switching ----
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + 'Pane').classList.add('active');
    document.getElementById('statusBox').className = 'status';
    if (tab.dataset.tab === 'signup') {
      document.getElementById('cardTitle').textContent = 'Create your account';
      document.getElementById('cardSub').textContent = 'Sign up to purchase and access courses.';
    } else {
      document.getElementById('cardTitle').textContent = 'Welcome back';
      document.getElementById('cardSub').textContent = 'Sign in to access your courses.';
    }
  });
});

// ---- If a returnTo param exists, show why we're here ----
if (new URLSearchParams(window.location.search).get('returnTo')) {
  setStatus('info', 'Please sign in to continue.');
}

// ---- Sign in ----
document.getElementById('signinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signinBtn');
  btn.disabled = true;
  const email = document.getElementById('signinEmail').value;
  const password = document.getElementById('signinPassword').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    setStatus('error', error.message);
    btn.disabled = false;
    return;
  }
  setStatus('success', 'Signed in — redirecting…');
  window.location.href = await getPostSignInDestination();
});

// ---- Sign up ----
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signupBtn');
  btn.disabled = true;
  const fullName = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;

  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name: fullName } }
  });
  if (error) {
    setStatus('error', error.message);
    btn.disabled = false;
    return;
  }
  // The profile row is created automatically by a database trigger
  // (see schema.sql) — reliable even before email confirmation.

  if (data.session) {
    setStatus('success', 'Account created — redirecting…');
    window.location.href = await getPostSignInDestination();
  } else {
    setStatus('info', 'Check your email to confirm your account, then sign in.');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
