<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — ISL, The Institute of Spiritual Learning</title>
<style>
:root{
  --clr-primary:       #2aa9d0;
  --clr-primary-dark:  #1f88a8;
  --clr-primary-light: #eef8fb;
  --clr-gold:          #f0b106;
  --clr-gold-light:    #fff6e0;
  --clr-bg:            #f5f6f7;
  --clr-surface:       #ffffff;
  --clr-border:        #e7e7e7;
  --clr-text:          #262626;
  --clr-text-muted:    #6b6b6b;
  --clr-success:       #1f9d6b;
  --clr-error:         #c0392b;
  --radius-md: 10px;
  --max: 900px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--clr-bg);color:var(--clr-text)}
.wrap{max-width:var(--max);margin:auto;padding:0 24px}
header{background:var(--clr-surface);border-bottom:1px solid var(--clr-border);padding:16px 0}
.header-row{display:flex;justify-content:space-between;align-items:center}
.header-row a.home{font-weight:800;text-decoration:none;color:var(--clr-text)}
#signOutBtn{background:none;border:1px solid var(--clr-border);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.85rem}
main{padding:40px 0 80px}
h1{font-size:1.6rem;margin:0 0 6px}
.sub{color:var(--clr-text-muted);margin:0 0 32px}
.empty-state{background:var(--clr-surface);border:1px solid var(--clr-border);border-radius:var(--radius-md);padding:40px;text-align:center;color:var(--clr-text-muted)}
.empty-state a{color:var(--clr-primary-dark);font-weight:700;text-decoration:none}
.course-block{background:var(--clr-surface);border:1px solid var(--clr-border);border-radius:var(--radius-md);padding:28px;margin-bottom:20px}
.course-block h2{font-size:1.2rem;margin:0 0 4px}
.course-block .meta{color:var(--clr-text-muted);font-size:.85rem;margin-bottom:18px}
.content-item{border-top:1px solid var(--clr-border);padding:16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.content-item:first-of-type{border-top:none}
.content-item h3{font-size:.98rem;margin:0 0 4px}
.content-item p{font-size:.88rem;color:var(--clr-text-muted);margin:0}
.content-item .week{font-family:monospace;font-size:.72rem;color:var(--clr-primary-dark);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.attempt-btn{flex-shrink:0;background:var(--clr-primary-light);color:var(--clr-primary-dark);border:1px solid rgba(42,169,208,.3);border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
.attempt-btn.done{background:var(--clr-success);color:#fff;border-color:var(--clr-success);cursor:default}
.download-link{display:inline-block;margin-top:6px;font-size:.82rem;color:var(--clr-primary-dark);text-decoration:underline}
.booking-cta{background:var(--clr-gold-light);border:1px solid rgba(240,177,6,.35);border-radius:var(--radius-md);padding:20px 24px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.booking-cta p{margin:0;font-size:.9rem}
.booking-cta .btn{background:var(--clr-gold);color:#3a2c00;border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:.85rem;text-decoration:none;white-space:nowrap}
.loading{text-align:center;padding:60px;color:var(--clr-text-muted)}
</style>
</head>
<body>
<header>
  <div class="wrap header-row">
    <a class="home" href="index.html">ISL</a>
    <button id="signOutBtn">Sign Out</button>
  </div>
</header>

<main class="wrap">
  <h1>My Courses</h1>
  <p class="sub" id="welcomeMsg">Loading your account…</p>
  <div id="content" class="loading">Loading your courses…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
(async () => {
  const user = await requireAuth();
  if (!user) return; // requireAuth already redirected to sign in

  document.getElementById('welcomeMsg').textContent =
    `Signed in as ${user.email}`;

  const contentEl = document.getElementById('content');

  const [purchases, eligibleCourseIds] = await Promise.all([
    getMyPurchases(),
    getBookingEligibility(),
  ]);

  if (purchases.length === 0) {
    contentEl.innerHTML = `
      <div class="empty-state">
        You haven't purchased any courses yet.<br>
        <a href="courses.html">Browse the course catalog →</a>
      </div>`;
    return;
  }

  // Fetch course titles for display
  const courseIds = purchases.map(p => p.course_id);
  const { data: courseRows } = await sb
    .from('courses').select('id, title, duration').in('id', courseIds);
  const courseInfo = Object.fromEntries((courseRows || []).map(c => [c.id, c]));

  let html = '';
  for (const purchase of purchases) {
    const course = courseInfo[purchase.course_id] || { title: purchase.course_id, duration: '' };
    const content = await getGatedContent(purchase.course_id);
    const isEligible = eligibleCourseIds.includes(purchase.course_id);

    html += `<div class="course-block">
      <h2>${course.title}</h2>
      <div class="meta">${course.duration || ''} &middot; Purchased ${new Date(purchase.created_at).toLocaleDateString()}</div>`;

    if (content.length === 0) {
      html += `<p style="color:var(--clr-text-muted); font-size:.9rem;">Course materials are being finalised — check back soon.</p>`;
    } else {
      for (const item of content) {
        html += `
          <div class="content-item">
            <div>
              ${item.week_number ? `<div class="week">Week ${item.week_number}</div>` : ''}
              <h3>${item.title}</h3>
              ${item.body ? `<p>${item.body}</p>` : ''}
              ${item.download_url ? `<a class="download-link" href="${item.download_url}" target="_blank" rel="noopener">Download materials →</a>` : ''}
            </div>
            <button class="attempt-btn" data-content-id="${item.id}">Mark as attempted</button>
          </div>`;
      }
    }

    html += `
      <div class="booking-cta">
        ${isEligible
          ? `<p><strong>You're eligible for 1-to-1 contact</strong> on this course.</p>
             <a class="btn" href="mailto:admin@ISLearning.org?subject=1-to-1%20on%20${encodeURIComponent(course.title)}">Book a session</a>`
          : `<p>Attempt at least one piece of course content to unlock 1-to-1 booking.</p>`}
      </div>
    </div>`;
  }
  contentEl.className = '';
  contentEl.innerHTML = html;

  // Wire up "mark as attempted" buttons
  contentEl.querySelectorAll('.attempt-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await markAttempted(btn.dataset.contentId);
      btn.textContent = 'Attempted ✓';
      btn.classList.add('done');
      // Refresh eligibility without a full reload
      location.reload();
    });
  });
})();

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'index.html';
});
</script>
</body>
</html>
